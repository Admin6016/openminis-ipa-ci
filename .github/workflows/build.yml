name: Build Unsigned IPA

# Build an unsigned iOS IPA from an OpenMinis-style source tree.
# Source repo is supplied at dispatch time and masked in logs.
on:
  workflow_dispatch:
    inputs:
      src_repo:
        description: 'source repo owner/name'
        required: true
      src_ref:
        description: 'source ref (branch/tag/sha)'
        required: true
        default: 'main'
      cache_key_extra:
        description: 'extra cache key suffix (bump to force dep rebuild)'
        required: false
        default: 'v1'

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 355
    env:
      SRC_REPO: ${{ inputs.src_repo }}
      SRC_REF: ${{ inputs.src_ref }}
    steps:
      - name: Mask source repo
        run: |
          echo "::add-mask::$SRC_REPO"
          echo "::add-mask::$SRC_REF"

      - name: Checkout pipeline scripts
        uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcode-select -p
          ls /Applications | grep -i '^Xcode' || true
          sysctl -n hw.ncpu

      - name: Fetch source
        env:
          SRC_TOKEN: ${{ secrets.SRC_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p work
          code=$(curl -sS -o /tmp/src.tgz -w '%{http_code}' -L \
            -H "Authorization: token $SRC_TOKEN" \
            "https://api.github.com/repos/$SRC_REPO/tarball/$SRC_REF")
          echo "fetch http=$code size=$(wc -c </tmp/src.tgz)"
          [ "$code" = "200" ] || { head -c 300 /tmp/src.tgz; exit 1; }
          tar xzf /tmp/src.tgz -C work --strip-components=1
          ls -la work | head -30

          # A GitHub tarball cannot carry git submodules (they arrive as empty
          # directories). Detect that and fall back to a shallow, recursive
          # clone, which is the only thing that can materialize them.
          if [ -d work/deps/ish ] && [ -f work/deps/ish/meson.build ]; then
            echo "deps/ish is in-tree — tarball is sufficient"
          else
            echo "deps/ish is a submodule (empty from tarball) — re-fetching via git clone"
            rm -rf work && mkdir -p work
            git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$SRC_TOKEN" | base64)" \
              clone --depth 1 --branch "$SRC_REF" --recurse-submodules --shallow-submodules \
              "https://github.com/$SRC_REPO.git" work
            rm -rf work/.git
            ls work/deps/ish/meson.build
            echo "recursive clone ok"
          fi

      - name: Restore native deps cache
        id: depcache
        uses: actions/cache/restore@v4
        with:
          path: |
            work/deps/libs
            work/deps/include
            work/deps/frameworks
            work/deps/resources
            work/deps/lame-build
            work/deps/build
          key: openminis-deps-${{ inputs.cache_key_extra }}-${{ github.run_id }}
          restore-keys: |
            openminis-deps-${{ inputs.cache_key_extra }}-

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install build tools
        run: |
          set -euo pipefail
          brew install ninja llvm lld libarchive pkg-config
          python3 -m pip install --break-system-packages meson || python3 -m pip install meson
          LLVM_BIN="$(brew --prefix)/opt/llvm/bin"
          echo "$LLVM_BIN" >> "$GITHUB_PATH"
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix)/opt/libarchive/lib/pkgconfig" >> "$GITHUB_ENV"
          meson --version || python3 -m mesonbuild.mesonmain --version
          ninja --version
          command -v go && go version
          ls -l "$LLVM_BIN"/clang "$LLVM_BIN"/ld.lld 2>&1 || true
          command -v ld.lld || ls -l "$(brew --prefix lld 2>/dev/null)/bin" 2>/dev/null || true
          # clang -fuse-ld=lld needs ld.lld reachable; make sure it is
          LLD_SRC="$(brew --prefix)/bin/ld.lld"
          if [ -x "$LLD_SRC" ]; then
            ln -sf "$LLD_SRC" "$LLVM_BIN/ld.lld"
            echo "linked $LLD_SRC -> $LLVM_BIN/ld.lld"
          else
            echo "!! ld.lld missing"; brew list --versions lld || true
            find "$(brew --prefix)" -maxdepth 4 -name 'ld.lld' 2>/dev/null || true
          fi
          env -u SDKROOT -u IPHONEOS_DEPLOYMENT_TARGET "$LLVM_BIN/clang" -target aarch64-linux-gnu -fuse-ld=lld -nostdlib -shared -x c /dev/null -o /tmp/_probe.so && echo "VDSO linker probe OK" || { echo "VDSO linker probe FAILED"; exit 1; }
          ls -l "$(brew --prefix)/opt/libarchive/lib/libarchive.dylib" || true

      - name: Build native deps
        if: steps.depcache.outputs.cache-hit != 'true'
        working-directory: work
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix)/opt/llvm/bin:$(python3 -m site --user-base)/bin:$PATH"
          # tarball has no .git metadata -> neutralize build_ish.sh's submodule init
          sed -i '' 's|git submodule update --init --recursive|echo "[ci] skip submodule init (tarball)"|' deps/build_ish.sh
          # modern clang rejects bitcode flags; strip them from the vendored scripts
          sed -i '' 's| -fembed-bitcode||g' deps/build_lame.sh deps/build_ffmpeg.sh
          grep -n 'skip submodule init' deps/build_ish.sh
          grep -c 'fembed-bitcode' deps/build_lame.sh deps/build_ffmpeg.sh || true
          echo "########## 1/5 lame ##########"
          ./deps/build_lame.sh
          echo "########## 2/5 ffmpeg ##########"
          ./deps/build_ffmpeg.sh
          echo "########## 3/5 ish ##########"
          ./deps/build_ish.sh
          echo "########## 4/5 alpine rootfs ##########"
          ./deps/prepare_alpine_rootfs.sh
          echo "########## 5/5 rclone ##########"
          ./deps/build_rclone_ios.sh
          echo "########## deps done ##########"
          du -sh deps/libs deps/frameworks deps/resources deps/include

      - name: Save native deps cache
        if: steps.depcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            work/deps/libs
            work/deps/include
            work/deps/frameworks
            work/deps/resources
            work/deps/lame-build
            work/deps/build
          key: openminis-deps-${{ inputs.cache_key_extra }}-${{ github.run_id }}

      - name: Sanity check deps
        working-directory: work
        run: |
          set -euo pipefail
          for f in deps/libs/libish.a deps/libs/libish_emu.a deps/libs/libfakefs.a; do
            [ -f "$f" ] || { echo "MISSING $f"; ls -R deps/libs || true; exit 1; }
          done
          [ -d deps/frameworks/FFmpeg.framework ] || { echo "MISSING FFmpeg.framework"; ls deps/frameworks; exit 1; }
          [ -d deps/frameworks/Rclone.xcframework ] || { echo "MISSING Rclone.xcframework"; ls deps/frameworks; exit 1; }
          [ -f deps/resources/alpine-rootfs.zip ] || { echo "MISSING alpine-rootfs.zip"; ls deps/resources; exit 1; }
          echo "all native deps present"

      - name: Apply source patches
        working-directory: work
        run: |
          set -euo pipefail
          mkdir -p src/ios/Generated

          # [T-auto-continue] Install the new feature file, then register it in
          # the Xcode project. Minis uses explicit PBXFileReference entries (not
          # a synchronized group) for src/ios/Agent/**, so a dropped-in .swift
          # is not compiled until it is listed in the Sources phase.
          #
          # The file lives in this pipeline repo rather than the source repo:
          # the source repo is the user's own fork and should not be forked
          # further by build tooling. The copy is unconditional (it is our
          # file), but the registration is skipped if it is already present.
          if [ -f "$GITHUB_WORKSPACE/sources/AutoContinue.swift" ]; then
            echo "########## install: AutoContinue.swift ##########"
            cp "$GITHUB_WORKSPACE/sources/AutoContinue.swift" \
               src/ios/Agent/Chat/AutoContinue.swift
            if [ -f "$GITHUB_WORKSPACE/scripts/add_source_file.py" ]; then
              python3 "$GITHUB_WORKSPACE/scripts/add_source_file.py" "$PWD" \
                AutoContinue.swift "AIChatViewModel+Fallback.swift"
            fi
          fi

          # [ci-fix-panel] Install the aggregate sub-agent panel view, then let
          # the patch loop register it in the Xcode project (src/ios uses
          # explicit PBXFileReference entries, so a dropped-in file is not
          # compiled until it is listed).
          if [ -f "$GITHUB_WORKSPACE/sources/SubAgentPanel.swift" ]; then
            echo "########## install: SubAgentPanel.swift ##########"
            cp "$GITHUB_WORKSPACE/sources/SubAgentPanel.swift" \
               src/ios/Views/Chat/SubAgentPanel.swift
            if [ -f "$GITHUB_WORKSPACE/scripts/add_source_file.py" ]; then
              python3 "$GITHUB_WORKSPACE/scripts/add_source_file.py" "$PWD" \
                SubAgentPanel.swift "ToolLiveSheet.swift"
            fi
          fi

          # Each script is feature-gated and idempotent: it no-ops on a tree
          # that legitimately lacks the feature and reports ALREADY when it has
          # been applied before, so this step is safe on any source tree.
          for s in fix_sources fix_headless_stream fix_subagent_async fix_subagent_panel fix_panel_collapse fix_agent_introspection fix_auto_continue fix_settings_extras; do
            if [ -f "$GITHUB_WORKSPACE/scripts/$s.py" ]; then
              echo "########## patch: $s ##########"
              python3 "$GITHUB_WORKSPACE/scripts/$s.py" "$PWD"
            fi
          done

          # BUILDING.md: build-time customization values are injected from a
          # file that is deliberately not committed. An empty value is a valid
          # configuration (it only disables the Claude-OAuth sign-in path), but
          # the xcconfig must still EXIST or the base-configuration reference
          # fails the archive outright.
          if [ -f src/ios/Configs/ProviderCustomization.xcconfig.example ] \
             && [ ! -f src/ios/Configs/ProviderCustomization.xcconfig ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example \
               src/ios/Configs/ProviderCustomization.xcconfig
            echo "created ProviderCustomization.xcconfig from .example"
          fi

      - name: Build app (unsigned archive)
        working-directory: work
        run: |
          set -o pipefail
          set +e
          # Archive with signing fully disabled: no team, no provisioning
          # profile, no keychain identity is available on the runner. The
          # capability entitlements are applied afterwards by
          # scripts/sign_adhoc.sh, which is the step that actually matters —
          # see the comment there for why an entitlement-free binary crashes.
          #
          # NOTE: do NOT pass CODE_SIGN_ENTITLEMENTS="" here. That override
          # would both strip the capability set from the archive and hide the
          # fact that we rely on the entitlements files in src/ios/.
          xcodebuild \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/Minis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive > /tmp/xcode.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "=== BUILD FAILED rc=$rc ==="
            grep -nE 'error:|Error:|failed|FAILED|fatal error' /tmp/xcode.log | tail -150 || true
            echo "=== last 200 lines ==="
            tail -200 /tmp/xcode.log
            exit 1
          fi
          echo "=== archive ok ==="
          tail -15 /tmp/xcode.log

      - name: Package + ad-hoc sign IPA
        working-directory: work
        run: |
          set -euo pipefail
          APP="$(find build/Minis.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -type d | head -1)"
          test -n "$APP"
          echo "APP=$APP"
          du -sh "$APP"

          # Ad-hoc sign with the capability entitlements (App Group, HealthKit,
          # iCloud, ...). TrollStore reads these back when it re-signs on
          # install, so this is what makes App Groups usable on-device.
          bash "$GITHUB_WORKSPACE/scripts/sign_adhoc.sh" "$APP" "src/ios"

          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          ( cd out && zip -qry Minis-unsigned.ipa Payload )
          ( cd out && zip -qr dSYMs.zip ../build/Minis.xcarchive/dSYMs 2>/dev/null || true )
          rm -rf out/Payload
          ls -lh out/
          unzip -l out/Minis-unsigned.ipa | head -6

      - name: Verify IPA payload retains signature + entitlements
        working-directory: work
        run: |
          set -euo pipefail
          rm -rf verify && mkdir -p verify
          unzip -q out/Minis-unsigned.ipa -d verify
          VAPP="verify/Payload/Minis.app"
          # Re-verify on the exact bytes a device will install.
          codesign -dv "$VAPP"
          echo "--- entitlements in the packaged app ---"
          codesign -d --entitlements - --xml "$VAPP" \
            | python3 -c 'import sys,plistlib;d=plistlib.loads(sys.stdin.buffer.read());print("\n".join(f"  {k} = {v}" for k,v in sorted(d.items())))'
          codesign -d --entitlements - --xml "$VAPP" \
            | grep -q 'group.com.openminis.app' \
            || { echo "!! App Group entitlement lost in packaging"; exit 1; }
          echo "OK: packaged app carries group.com.openminis.app"
          rm -rf verify

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: minis-ipa
          path: work/out/Minis-unsigned.ipa
          retention-days: 5
          if-no-files-found: error

      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minis-dsyms
          path: work/out/dSYMs.zip
          retention-days: 5
          if-no-files-found: ignore

      - name: Upload xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-log
          path: /tmp/xcode.log
          retention-days: 5
          if-no-files-found: ignore
